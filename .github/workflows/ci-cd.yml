name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ci-cd.yml"

permissions:
  id-token: write  # required to assume the AWS role via OIDC
  contents: read   # manifest updates go to observability-project1-gitops via GITOPS_PAT, not this repo's GITHUB_TOKEN

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: orders-backend-dev

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install
      - run: npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        working-directory: app
        run: |
          IMAGE_URI="$REGISTRY/${{ env.ECR_REPOSITORY }}:$TAG"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

  update-manifest:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # k8s manifests live in the separate observability-project1-gitops repo
      # (see that repo's applications/orders-backend.yaml), not here. GITOPS_PAT
      # is a fine-grained PAT scoped to write access on that repo only -- add it
      # under Settings -> Secrets and variables -> Actions in THIS repo.
      - uses: actions/checkout@v4
        with:
          repository: gayatriaavula/observability-project1-gitops
          ref: main
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops

      - name: Install kustomize
        run: |
          command -v kustomize >/dev/null || \
            curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash -s -- 5.4.1 /usr/local/bin
          kustomize version

      - name: Point k8s/base at the new image
        working-directory: gitops/k8s/base
        run: |
          kustomize edit set image "orders-backend=${{ needs.build-and-push.outputs.image }}"

      - name: Commit and push the manifest update
        working-directory: gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/base/kustomization.yaml
          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
          else
            git commit -m "deploy: orders-backend@${{ github.sha }}"
            git push origin main
          fi

      # Argo CD (auto-sync + self-heal, see applications/orders-backend.yaml in
      # the observability-project1-gitops repo) detects this commit and rolls
      # the new image out to the cluster on its own polling interval -- no
      # further action needed here.
