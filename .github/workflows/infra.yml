name: Infra (Terraform)

# Separate from ci-cd.yml (which only builds/pushes the app image): this
# workflow only ever touches infra/terraform, and never builds or deploys
# the application itself.
on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/infra.yml"

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.15.7"

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Scan Terraform for misconfigurations
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: "config"
          scan-ref: "infra/terraform"
          skip-dirs: "**/.terraform"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

  plan:
    needs: scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # required to assume the AWS role via OIDC
      contents: read
      pull-requests: write    # required to post the plan as a PR comment
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    defaults:
      run:
        working-directory: infra/terraform/environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ matrix.environment == 'dev' && vars.TERRAFORM_CI_ROLE_ARN_DEV || vars.TERRAFORM_CI_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform fmt check
        run: terraform fmt -check -recursive ../../

      - name: Terraform init
        run: terraform init -input=false -lock-timeout=300s

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: |
          terraform plan -input=false -lock-timeout=300s -no-color -out=tfplan 2>&1 | tee plan.txt
          exit "${PIPESTATUS[0]}"

      - name: Comment plan on PR
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const path = 'infra/terraform/environments/${{ matrix.environment }}/plan.txt';
            let body = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'No plan output (see job logs).';
            const maxLen = 60000;
            if (body.length > maxLen) {
              body = body.slice(0, maxLen) + '\n\n... (truncated, see full output in the job logs)';
            }

            const marker = `<!-- terraform-plan-${{ matrix.environment }} -->`;
            const commentBody = `${marker}\n### Terraform plan: \`${{ matrix.environment }}\`\n\n\`\`\`diff\n${body}\n\`\`\``;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }

  apply:
    needs: scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # required to assume the AWS role via OIDC
      contents: read
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    # Gated by a GitHub Environment protection rule -- add required reviewers
    # to the "infra-dev" / "infra-prod" environments in repo Settings so apply
    # pauses for approval instead of running immediately on merge.
    environment: infra-${{ matrix.environment }}
    defaults:
      run:
        working-directory: infra/terraform/environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ matrix.environment == 'dev' && vars.TERRAFORM_CI_ROLE_ARN_DEV || vars.TERRAFORM_CI_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init -input=false -lock-timeout=300s

      - name: Terraform apply
        run: terraform apply -input=false -lock-timeout=300s -auto-approve
