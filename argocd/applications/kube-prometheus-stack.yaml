# Deploys Prometheus + Grafana + Alertmanager via the upstream Helm chart,
# configured with our values in k8s/monitoring/kube-prometheus-stack-values.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "61.x"
      helm:
        valueFiles:
          - $values/k8s/monitoring/kube-prometheus-stack-values.yaml
    - repoURL: https://github.com/gayatriaavula/observability-project1.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
