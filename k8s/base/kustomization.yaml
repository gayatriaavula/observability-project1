apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- namespace.yaml
- serviceaccount.yaml
- configmap.yaml
- secret.yaml
- deployment.yaml
- service.yaml
- hpa.yaml
- pdb.yaml
- gateway.yaml
- virtualservice.yaml
- destinationrule.yaml
- peerauthentication.yaml

# CI overwrites the tag on every build (see .github/workflows/ci-cd.yml),
# committing the change so Argo CD picks it up and syncs the new image.
images:
- name: orders-backend
  newName: 866934333672.dkr.ecr.us-east-1.amazonaws.com/orders-backend
  newTag: dbc0cb7c8140a2249a4d587568a15b17940f23b3
